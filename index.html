
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUENT LAB | Learn. Practice. Progress.</title>
<style>
:root {
  --navy:#172554;
  --blue:#3457D5;
  --pale:#F4F6FC;
  --text:#202943;
  --muted:#75809A;
  --line:#E5E9F2;
  --white:#FFFFFF;
  --green:#17865B;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family:Inter,Arial,sans-serif;
  background:var(--pale); color:var(--text);
}
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
.layout { min-height:100vh; display:flex; }
.sidebar {
  width:245px; background:var(--navy); color:white;
  padding:25px 16px; flex-shrink:0;
}
.brand { display:flex; align-items:center; gap:11px; padding:0 10px 27px; }
.logo {
  width:42px;height:42px;border-radius:13px;
  background:#748BFF;display:grid;place-items:center;font-size:23px;
}
.brand h2 { font-size:19px;margin:0;letter-spacing:1px; }
.brand small { color:#B9C7FF;font-size:11px; }
.nav-label { color:#9EACD1;font-size:10px;letter-spacing:1.5px;padding:18px 12px 8px; }
.nav-btn {
  display:flex;gap:12px;align-items:center;width:100%;
  border:0;background:transparent;color:#D6DDF4;text-align:left;
  padding:12px;border-radius:9px;margin:2px 0;font-size:13px;
}
.nav-btn:hover,.nav-btn.active { background:#304273;color:white; }
.sidebar-foot { margin-top:35px;padding:12px;color:#B9C7FF;font-size:11px;line-height:1.7; }
main { flex:1;min-width:0; }
.topbar {
  height:76px;background:white;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;gap:15px;
}
.topbar h3 { margin:0;font-size:17px; }
.topbar small { color:var(--muted); }
.role-select { border:1px solid var(--line);border-radius:8px;padding:9px;background:white; }
.content { padding:30px;max-width:1500px;margin:auto; }
.eyebrow { color:var(--blue);font-size:11px;font-weight:bold;letter-spacing:1.5px; }
h1 { margin:8px 0;font-size:27px;letter-spacing:-.6px; }
.subtitle { color:var(--muted);font-size:13px;line-height:1.6; }
.toolbar { display:flex;gap:10px;flex-wrap:wrap;margin:22px 0; }
.btn {
  border:1px solid var(--line);background:white;color:var(--text);
  padding:10px 14px;border-radius:8px;font-weight:600;font-size:12px;
}
.btn.primary { background:var(--blue);color:white;border-color:var(--blue); }
.btn:hover { opacity:.86; }
.grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:22px 0; }
.card {
  background:white;border:1px solid var(--line);border-radius:13px;
  padding:20px;min-width:0;
}
.metric-top { display:flex;justify-content:space-between;align-items:center;gap:8px; }
.metric-icon { width:38px;height:38px;background:#EEF1FF;border-radius:10px;display:grid;place-items:center;font-size:19px; }
.metric-label { color:var(--muted);font-size:12px; }
.metric-value { font-size:29px;font-weight:750;margin:16px 0 5px; }
.metric-note { color:var(--muted);font-size:11px; }
.section-head { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px; }
.section-head h2 { font-size:16px;margin:0; }
.two-col { display:grid;grid-template-columns:1.25fr 1fr;gap:18px; }
.activity { display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line); }
.activity:last-child { border:0; }
.dot { width:9px;height:9px;border-radius:50%;background:#6C83F5;margin-top:5px;flex-shrink:0; }
.activity strong { font-size:12px; }
.activity p { margin:5px 0;color:var(--muted);font-size:11px;line-height:1.5; }
.pill { display:inline-block;border-radius:20px;padding:5px 9px;font-size:10px;background:#EEF1FF;color:#3457D5; }
.pill.green { background:#E4F7EE;color:#14764F; }
.pill.orange { background:#FFF1DA;color:#A3630C; }
.pill.gray { background:#EFF1F5;color:#69748B; }
.table-wrap { overflow-x:auto; }
table { border-collapse:collapse;width:100%;font-size:12px; }
th { text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;background:#FAFBFE; }
th,td { padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap; }
td { font-size:12px; }
.person { display:flex;align-items:center;gap:10px; }
.avatar { width:34px;height:34px;display:grid;place-items:center;background:#E8ECFF;color:var(--blue);border-radius:50%;font-weight:bold; }
.person small { display:block;color:var(--muted);margin-top:4px; }
.search { border:1px solid var(--line);padding:10px 12px;border-radius:8px;min-width:190px;background:white; }
.course-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px; }
.course-icon { font-size:24px;margin-bottom:16px; }
.course-card h3 { font-size:15px;margin:0 0 8px; }
.course-card p { color:var(--muted);font-size:12px;line-height:1.6; }
.progress { height:6px;background:#E9ECF5;border-radius:20px;overflow:hidden;margin:12px 0; }
.progress span { display:block;height:100%;background:var(--blue);border-radius:20px; }
.empty { text-align:center;padding:35px 15px;color:var(--muted);font-size:12px; }
.modal-bg {
  position:fixed;inset:0;background:#111B35A6;display:none;
  align-items:center;justify-content:center;padding:18px;z-index:5;
}
.modal {
  width:100%;max-width:500px;max-height:90vh;overflow:auto;
  background:white;border-radius:15px;padding:25px;
}
.modal h2 { margin-top:0;font-size:20px; }
.form-field { margin:15px 0; }
.form-field label { display:block;font-size:12px;font-weight:600;margin-bottom:7px; }
.form-field input,.form-field select,.form-field textarea {
  width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:white;
}
.form-field textarea { min-height:85px;resize:vertical; }
.form-actions { display:flex;justify-content:flex-end;gap:9px;margin-top:20px; }
.notice { background:#FFF8E8;border:1px solid #F4E2B3;color:#7E5A12;border-radius:9px;padding:13px;font-size:11px;line-height:1.6;margin-top:20px; }
.mobile-menu { display:none; }
footer { text-align:center;color:var(--muted);font-size:10px;padding:28px 0; }
@media(max-width:1050px) {
 .sidebar { width:205px; }
 .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
 .course-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
 .content { padding:22px; }
}
@media(max-width:700px) {
 .layout { display:block; }
 .sidebar { width:100%;padding:12px; }
 .brand { padding:5px 8px 12px; }
 .sidebar .nav-label,.sidebar-foot { display:none; }
 .nav-list { display:flex;overflow-x:auto;gap:4px; }
 .nav-btn { width:auto;flex-shrink:0;padding:10px;font-size:11px; }
 .topbar { height:auto;min-height:65px;padding:13px 17px; }
 .content { padding:18px 14px; }
 .grid { gap:9px; }
 .card { padding:14px; }
 .metric-value { font-size:24px; }
 .two-col,.course-grid { grid-template-columns:1fr; }
 .topbar h3 { font-size:14px; }
 .role-select { max-width:130px;font-size:11px; }
 h1 { font-size:23px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <img class="brand-mark" src="LOGO.png" alt="FLUENT LAB">
      <div class="logo">F</div>
      <div><h2>FLUENT LAB</h2><small>LEARN. PRACTICE. PROGRESS.</small></div>
    </div>
    <div class="nav-label">WORKSPACE</div>
    <nav class="nav-list" id="navigation"></nav>
    <div class="sidebar-foot">A dedicated space for learning English.<br>FLUENT LAB · Learning platform</div>
  </aside>
  <main>
    <header class="topbar">
      <div><h3 id="pageTitle">Dashboard</h3><small id="dateLabel"></small></div>
      <select class="role-select" id="roleSelect" aria-label="Preview role">
        <option value="Owner">Owner / Admin preview</option>
        <option value="Teacher">Teacher preview</option>
        <option value="Student">Student preview</option>
        <option value="Parent">Parent preview</option>
      </select>
    </header>
    <section class="content" id="app"></section>
  </main>
</div>

<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="modalTitle">Create item</h2>
    <form id="modalForm">
      <div id="modalFields"></div>
      <div class="form-actions">
        <button class="btn" type="button" onclick="closeModal()">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
const KEY = "fluentlab-demo-v1";
const initialData = {
  classes: [
    {id:1,name:"General English A1",level:"A1",teacher:"Govhar Yaqubova",students:12,status:"Active"},
    {id:2,name:"Primary English",level:"Primary",teacher:"Govhar Yaqubova",students:9,status:"Active"},
    {id:3,name:"Exam Preparation",level:"B1",teacher:"Govhar Yaqubova",students:8,status:"Active"}
  ],
  students: [
    {id:1,name:"Aylin M.",email:"aylin.demo@example.com",className:"General English A1",status:"Active",score:86},
    {id:2,name:"Murad A.",email:"murad.demo@example.com",className:"Primary English",status:"Pending",score:0},
    {id:3,name:"Leyla R.",email:"leyla.demo@example.com",className:"Exam Preparation",status:"Active",score:92}
  ],
  resources: [
    {id:1,title:"Present Simple — Notes",category:"Grammar",course:"General English A1",type:"PDF"},
    {id:2,title:"Hobbies & Free Time",category:"Vocabulary",course:"General English A1",type:"Worksheet"},
    {id:3,title:"Reading: The Environment",category:"Reading",course:"Exam Preparation",type:"PDF"}
  ],
  exams: [
    {id:1,title:"Vocabulary Review",course:"General English A1",maxScore:20,status:"Published"},
    {id:2,title:"Grammar Unit Test",course:"Primary English",maxScore:30,status:"Draft"}
  ],
  results: [
    {id:1,student:"Aylin M.",exam:"Vocabulary Review",score:17,maxScore:20},
    {id:2,student:"Leyla R.",exam:"Vocabulary Review",score:19,maxScore:20}
  ],
  activity: [
    {title:"Welcome to FLUENT LAB",description:"Your learning workspace is ready to customize.",time:"Just now"}
  ]
};
let db = loadData();
let role = "Owner";
let currentPage = "Dashboard";
let formConfig = null;

function loadData(){
  try {
    const saved = localStorage.getItem(KEY);
    return saved ? JSON.parse(saved) : structuredClone(initialData);
  } catch(e) { return structuredClone(initialData); }
}
function saveData(){ localStorage.setItem(KEY,JSON.stringify(db)); }
function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeText(value){ return escapeHtml(value); }
const navByRole = {
  Owner:["Dashboard","Classrooms","Students","Resources","Exams & Results","Progress","Settings"],
  Teacher:["Dashboard","Classrooms","Students","Resources","Exams & Results","Progress"],
  Student:["Dashboard","My Classes","Resources","My Exams","My Progress"],
  Parent:["Dashboard","My Children","Results & Progress","Messages"]
};
const icons = {
  "Dashboard":"⌂","Classrooms":"▦","My Classes":"▦","Students":"♙",
  "Resources":"▤","Exams & Results":"✓","My Exams":"✓","Progress":"↗",
  "My Progress":"↗","Settings":"⚙","My Children":"♡",
  "Results & Progress":"▥","Messages":"✉"
};
function updateNavigation(){
  document.getElementById("navigation").innerHTML=navByRole[role].map(item=>
    `<button class="nav-btn ${item===currentPage?"active":""}" onclick="navigate('${item}')">
    <span>${icons[item]||"•"}</span>${item}</button>`).join("");
}
function navigate(page){currentPage=page;render();}
function changeRole(value){
  role=value;
  currentPage="Dashboard";
  render();
}
function recordActivity(title,description){
  db.activity.unshift({title,description,time:new Date().toLocaleString()});
  db.activity=db.activity.slice(0,30);
}
function metric(label,value,icon,note){
 return `<div class="card"><div class="metric-top"><span class="metric-label">${label}</span><div class="metric-icon">${icon}</div></div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`;
}
function section(title,action=""){
 return `<div class="section-head"><h2>${title}</h2>${action}</div>`;
}
function activityPanel(){
 const rows=db.activity.slice(0,5).map(a=>`<div class="activity"><div class="dot"></div><div><strong>${safeText(a.title)}</strong><p>${safeText(a.description)}<br>${safeText(a.time)}</p></div></div>`).join("");
 return `<div class="card">${section("Recent activity")} ${rows||'<div class="empty">No activity yet.</div>'}</div>`;
}
function dashboard(){
 const activeStudents=db.students.filter(s=>s.status==="Active").length;
 const pending=db.students.filter(s=>s.status==="Pending").length;
 const average=db.results.length?Math.round(db.results.reduce((n,r)=>n+r.score/r.maxScore*100,0)/db.results.length):0;
 let metrics="",details="";
 if(role==="Owner"){
  metrics=metric("Active students",activeStudents,"♙","Approved student accounts")
   +metric("Classrooms",db.classes.length,"▦","Created learning groups")
   +metric("Learning resources",db.resources.length,"▤","Uploaded resource records")
   +metric("Pending approvals",pending,"◷","Require owner review");
  details=`<div class="card">${section("Registration approvals",`<span class="pill orange">${pending} pending</span>`)}
  ${db.students.filter(s=>s.status==="Pending").map(s=>`<div class="activity"><div class="avatar">${safeText(s.name[0])}</div><div style="flex:1"><strong>${safeText(s.name)}</strong><p>${safeText(s.email)} · ${safeText(s.className)}</p></div><button class="btn primary" onclick="approveStudent(${s.id})">Approve</button></div>`).join("")||'<div class="empty">No pending registrations.</div>'}</div>`;
 } else if(role==="Teacher"){
  metrics=metric("My students",activeStudents,"♙","Demo workspace count")+metric("Classrooms",db.classes.length,"▦","Learning groups")+metric("Resources",db.resources.length,"▤","Learning materials")+metric("Average result",average+"%","↗","Based on recorded demo results");
  details=`<div class="card">${section("Teaching overview")}<p class="subtitle">Create learning materials, manage your classes, and record assessment results.</p></div>`;
 } else if(role==="Student"){
  metrics=metric("My classes",db.classes.length,"▦","Demo preview only")+metric("My resources",db.resources.length,"▤","Available in this prototype")+metric("My results",db.results.length,"✓","Demo assessment results")+metric("Average score",average+"%","↗","Demo result calculation");
  details=`<div class="card">${section("Continue learning")}<p class="subtitle">Explore the learning materials and exams in this prototype. A secure student account is not connected yet.</p></div>`;
 } else {
  metrics=metric("Children",1,"♡","Demo parent view")+metric("Courses",db.classes.length,"▦","Demo workspace count")+metric("Assessment results",db.results.length,"✓","Demo results")+metric("Average score",average+"%","↗","Demo result calculation");
  details=`<div class="card">${section("Child's learning overview")}<p class="subtitle">In the production system, this area will show only children linked and approved by the owner.</p></div>`;
 }
 return `<div class="eyebrow">LEARN. PRACTICE. PROGRESS.</div>
 <h1>${role==="Owner"?"Welcome to FLUENT LAB":role==="Teacher"?"Teaching dashboard":role==="Student"?"Your learning space":"Parent overview"}</h1>
 <p class="subtitle">Your English learning workspace, organized in one place.</p>
 <div class="grid">${metrics}</div>
 <div class="two-col"><div>${details}<div style="height:16px"></div>${activityPanel()}</div>
 <div class="card">${section("Quick actions")}
 ${role==="Owner"||role==="Teacher"?`
 <div class="activity"><div class="metric-icon">▦</div><div><strong>Manage classrooms</strong><p>Create classes and organize learning groups.</p><button class="btn" onclick="navigate('Classrooms')">Open classrooms →</button></div></div>
 <div class="activity"><div class="metric-icon">▤</div><div><strong>Add a resource</strong><p>Record a worksheet, video, or lesson note.</p><button class="btn" onclick="openCreate('resource')">Add resource →</button></div></div>
 <div class="activity"><div class="metric-icon">✓</div><div><strong>Create an exam</strong><p>Set up an assessment record.</p><button class="btn" onclick="openCreate('exam')">Create exam →</button></div></div>
 `:`<div class="activity"><div class="metric-icon">▤</div><div><strong>Learning resources</strong><p>Explore worksheets and lesson materials.</p><button class="btn" onclick="navigate('Resources')">Browse resources →</button></div></div>`}
 </div></div>
 <div class="notice"><strong>Prototype notice:</strong> Role selection is for previewing layouts only, not secure authentication. Data is stored in this browser and is not shared with other users. Do not enter real student information.</div>`;
}
function classroomsPage(){
 return `<div class="eyebrow">LEARNING MANAGEMENT</div><h1>Classrooms</h1><p class="subtitle">Organize students, levels, and courses.</p>
 <div class="toolbar"><button class="btn primary" onclick="openCreate('class')">＋ Create classroom</button></div>
 <div class="course-grid">${db.classes.map(c=>`<div class="card course-card"><div class="course-icon">▦</div><h3>${safeText(c.name)}</h3><p>Level: ${safeText(c.level)}<br>Teacher: ${safeText(c.teacher)}<br>Students: ${c.students}</p><span class="pill green">${safeText(c.status)}</span><div class="progress"><span style="width:65%"></span></div><button class="btn" onclick="editClass(${c.id})">Edit details</button></div>`).join("")||'<div class="empty">No classrooms created.</div>'}</div>`;
}
function studentsPage(){
 return `<div class="eyebrow">USER MANAGEMENT</div><h1>Students</h1><p class="subtitle">Review demo student profiles and registration statuses.</p>
 <div class="toolbar"><input class="search" id="studentSearch" placeholder="Search students..." oninput="filterStudents()">
 <button class="btn primary" onclick="openCreate('student')">＋ Add student</button></div>
 <div class="card table-wrap"><table><thead><tr><th>Student</th><th>Class</th><th>Status</th><th>Average</th><th>Action</th></tr></thead><tbody id="studentRows">${studentRows(db.students)}</tbody></table></div>`;
}
function studentRows(items){
 return items.map(s=>`<tr><td><div class="person"><div class="avatar">${safeText(s.name[0])}</div><div><strong>${safeText(s.name)}</strong><small>${safeText(s.email)}</small></div></div></td><td>${safeText(s.className)}</td><td><span class="pill ${s.status==="Active"?"green":s.status==="Pending"?"orange":"gray"}">${safeText(s.status)}</span></td><td>${s.score?s.score+"%":"—"}</td><td>${s.status==="Pending"?`<button class="btn primary" onclick="approveStudent(${s.id})">Approve</button>`:`<button class="btn" onclick="viewStudent(${s.id})">View</button>`}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No students found.</td></tr>';
}
function filterStudents(){
 const q=document.getElementById("studentSearch").value.toLowerCase();
 document.getElementById("studentRows").innerHTML=studentRows(db.students.filter(s=>(s.name+" "+s.email+" "+s.className).toLowerCase().includes(q)));
}
function resourcesPage(){
 return `<div class="eyebrow">LEARNING MATERIALS</div><h1>Resource Library</h1><p class="subtitle">Organize lessons, worksheets, notes, and videos.</p>
 <div class="toolbar"><input class="search" id="resourceSearch" placeholder="Search resources..." oninput="filterResources()">
 <button class="btn primary" onclick="openCreate('resource')">＋ Add resource</button></div>
 <div class="card table-wrap"><table><thead><tr><th>Resource</th><th>Category</th><th>Course</th><th>Type</th><th>Action</th></tr></thead><tbody id="resourceRows">${resourceRows(db.resources)}</tbody></table></div>
 <div class="notice">This prototype records resource details only. Secure file uploading and protected document viewing require private server storage and permissions.</div>`;
}
function resourceRows(items){
 return items.map(r=>`<tr><td><strong>${safeText(r.title)}</strong></td><td>${safeText(r.category)}</td><td>${safeText(r.course)}</td><td><span class="pill">${safeText(r.type)}</span></td><td><button class="btn" onclick="deleteItem('resources',${r.id})">Delete</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No resources yet.</td></tr>';
}
function filterResources(){
 const q=document.getElementById("resourceSearch").value.toLowerCase();
 document.getElementById("resourceRows").innerHTML=resourceRows(db.resources.filter(r=>(r.title+" "+r.category+" "+r.course).toLowerCase().includes(q)));
}
function examsPage(){
 return `<div class="eyebrow">ASSESSMENTS</div><h1>Exams & Results</h1><p class="subtitle">Create exam records and review recorded scores.</p>
 <div class="toolbar"><button class="btn primary" onclick="openCreate('exam')">＋ Create exam</button></div>
 <div class="card table-wrap">${section("Exams")}<table><thead><tr><th>Exam</th><th>Course</th><th>Max score</th><th>Status</th><th>Action</th></tr></thead><tbody>
 ${db.exams.map(e=>`<tr><td><strong>${safeText(e.title)}</strong></td><td>${safeText(e.course)}</td><td>${e.maxScore}</td><td><span class="pill ${e.status==="Published"?"green":"gray"}">${safeText(e.status)}</span></td><td><button class="btn" onclick="deleteItem('exams',${e.id})">Delete</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No exams created.</td></tr>'}
 </tbody></table></div>
 <div style="height:18px"></div><div class="card table-wrap">${section("Recorded results",`<button class="btn" onclick="openCreate('result')">＋ Add result</button>`)}
 <table><thead><tr><th>Student</th><th>Exam</th><th>Score</th><th>Percentage</th></tr></thead><tbody>
 ${db.results.map(r=>`<tr><td>${safeText(r.student)}</td><td>${safeText(r.exam)}</td><td>${r.score}/${r.maxScore}</td><td>${Math.round(r.score/r.maxScore*100)}%</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No results recorded.</td></tr>'}
 </tbody></table></div>`;
}
function progressPage(){
 return `<div class="eyebrow">LEARNING ANALYTICS</div><h1>Progress overview</h1><p class="subtitle">A summary of the assessment data saved in this browser.</p>
 <div class="grid">${metric("Recorded results",db.results.length,"✓","Demo records")}
 ${metric("Average score",db.results.length?Math.round(db.results.reduce((n,r)=>n+r.score/r.maxScore*100,0)/db.results.length)+"%":"—","↗","Based on recorded scores")}
 ${metric("Classrooms",db.classes.length,"▦","Learning groups")}
 ${metric("Resources",db.resources.length,"▤","Resource records")}</div>
 <div class="card">${section("Assessment history")}
 <div class="table-wrap"><table><thead><tr><th>Student</th><th>Assessment</th><th>Score</th><th>Progress</th></tr></thead><tbody>
 ${db.results.map(r=>`<tr><td>${safeText(r.student)}</td><td>${safeText(r.exam)}</td><td>${r.score}/${r.maxScore}</td><td><div class="progress" style="width:130px"><span style="width:${Math.max(0,Math.min(100,r.score/r.maxScore*100))}%"></span></div></td></tr>`).join("")||'<tr><td colspan="4" class="empty">Results will appear here when recorded.</td></tr>'}
 </tbody></table></div></div>`;
}
function settingsPage(){
 return `<div class="eyebrow">PLATFORM</div><h1>Settings</h1><p class="subtitle">Manage this local prototype.</p>
 <div class="card">${section("Demo data")}
 <p class="subtitle">Reset the browser's local demo data to the original sample. This action cannot be undone.</p>
 <button class="btn" onclick="resetDemo()">Reset demo data</button></div>
 <div class="notice">Production settings for user permissions, authentication providers, database access, email, and file storage must be configured on the server before real users are added.</div>`;
}
function render(){
 updateNavigation();
 document.getElementById("roleSelect").value=role;
 document.getElementById("pageTitle").textContent=currentPage;
 document.getElementById("dateLabel").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});
 const app=document.getElementById("app");
 if(currentPage==="Dashboard") app.innerHTML=dashboard();
 else if(currentPage==="Classrooms"||currentPage==="My Classes") app.innerHTML=classroomsPage();
 else if(currentPage==="Students") app.innerHTML=studentsPage();
 else if(currentPage==="Resources") app.innerHTML=resourcesPage();
 else if(currentPage==="Exams & Results"||currentPage==="My Exams") app.innerHTML=examsPage();
 else if(currentPage==="Progress"||currentPage==="My Progress"||currentPage==="Results & Progress") app.innerHTML=progressPage();
 else if(currentPage==="Settings") app.innerHTML=settingsPage();
 else if(currentPage==="My Children"||currentPage==="Messages") app.innerHTML=`<div class="eyebrow">PARENT PORTAL</div><h1>${safeText(currentPage)}</h1><div class="card"><div class="empty">This module will be connected to verified parent-child accounts in the secure backend phase.</div></div>`;
 else app.innerHTML=dashboard();
}
function openCreate(type){
 if((role!=="Owner"&&role!=="Teacher")||type==="student"&&role!=="Owner"){
  alert("This action is not available in this role preview.");return;
 }
 const configs={
  class:{title:"Create classroom",collection:"classes",fields:[
   ["name","Classroom name","text",true],["level","Level","select",true,["A1","A2","B1","B2","Primary","Exam Preparation"]],["teacher","Teacher","text",true],["students","Number of students","number",true]]},
  student:{title:"Add student",collection:"students",fields:[
   ["name","Student full name","text",true],["email","Student email","email",true],["className","Classroom","select",true,db.classes.map(c=>c.name)],["status","Account status","select",true,["Pending","Active"]]]},
  resource:{title:"Add resource",collection:"resources",fields:[
   ["title","Resource title","text",true],["category","Category","select",true,["Grammar","Vocabulary","Reading","Listening","Speaking","Writing","Pronunciation","Worksheet","Presentation","Video","Exam Preparation","Homework"]],["course","Course / classroom","select",true,db.classes.map(c=>c.name)],["type","Resource type","select",true,["PDF","DOCX","PPTX","Image","Audio","Video","Link","Worksheet","Notes"]]]},
  exam:{title:"Create exam",collection:"exams",fields:[
   ["title","Exam title","text",true],["course","Course / classroom","select",true,db.classes.map(c=>c.name)],["maxScore","Maximum score","number",true],["status","Status","select",true,["Draft","Published"]]]},
  result:{title:"Record result",collection:"results",fields:[
   ["student","Student","select",true,db.students.map(s=>s.name)],["exam","Exam","select",true,db.exams.map(e=>e.title)],["score","Score","number",true],["maxScore","Maximum score","number",true]]}
 };
 const cfg=configs[type];formConfig={type,...cfg};
 document.getElementById("modalTitle").textContent=cfg.title;
 document.getElementById("modalFields").innerHTML=cfg.fields.map(([name,label,inputType,required,options])=>{
  let input;
  if(inputType==="select") input=`<select name="${name}" ${required?"required":""}>${(options||[]).map(o=>`<option value="${safeText(o)}">${safeText(o)}</option>`).join("")}</select>`;
  else input=`<input name="${name}" type="${inputType}" ${required?"required":""} ${inputType==="number"?'min="0"':''} ${name==="students"?"value=\"0\"":""}>`;
  return `<div class="form-field"><label>${label}</label>${input}</div>`;
 }).join("");
 document.getElementById("modalBg").style.display="flex";
}
function closeModal(){document.getElementById("modalBg").style.display="none";}
document.getElementById("modalForm").addEventListener("submit",e=>{
 e.preventDefault();if(!formConfig)return;
 const values=Object.fromEntries(new FormData(e.target).entries());
 for(const key of Object.keys(values)){
  if(["students","maxScore","score"].includes(key)) values[key]=Number(values[key]);
 }
 values.id=Date.now();
 if(formConfig.type==="class") values.status="Active";
 if(formConfig.type==="student"&&!values.status) values.status="Pending";
 if(formConfig.type==="student") values.score=0;
 if(formConfig.type==="exam"&&!values.status) values.status="Draft";
 if(formConfig.type==="result"&&(!values.maxScore||values.score>values.maxScore)){
  alert("Score must not exceed the maximum score.");return;
 }
 db[formConfig.collection].push(values);
 recordActivity(formConfig.title,values.title||values.name||"New record saved");
 saveData();closeModal();render();
});
function approveStudent(id){
 if(role!=="Owner"){alert("Only the owner can approve registrations.");return;}
 const s=db.students.find(x=>x.id===id);if(!s)return;
 s.status="Active";recordActivity("Student approved",s.name+" was approved in this local demo.");
 saveData();render();
}
function deleteItem(collection,id){
 if(role!=="Owner"&&role!=="Teacher"){alert("Not available in this preview role.");return;}
 if(!confirm("Delete this demo record?"))return;
 db[collection]=db[collection].filter(x=>x.id!==id);
 recordActivity("Demo record deleted",collection+" record "+id);
 saveData();render();
}
function editClass(id){
 const c=db.classes.find(x=>x.id===id);if(!c)return;
 const name=prompt("Classroom name:",c.name);if(name===null||!name.trim())return;
 c.name=name.trim();recordActivity("Classroom updated",c.name);saveData();render();
}
function viewStudent(id){
 const s=db.students.find(x=>x.id===id);if(!s)return;
 alert("DEMO STUDENT PROFILE\\n\\nName: "+s.name+"\\nEmail: "+s.email+"\\nClass: "+s.className+"\\nStatus: "+s.status+"\\nAverage: "+(s.score||"No result")+"\\n\\nA secure production profile will use authenticated database access.");
}
function resetDemo(){
 if(!confirm("Reset all local demo data?"))return;
 db=structuredClone(initialData);saveData();recordActivity("Demo data reset","Sample records restored.");saveData();render();
}
document.getElementById("roleSelect").addEventListener("change",e=>changeRole(e.target.value));
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});
render();
</script>
<footer>FLUENT LAB · LEARN. PRACTICE. PROGRESS.</footer>
