<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554"><meta name="description" content="FLUENT LAB — learn, practice, progress.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>FLUENT LAB | Learn. Practice. Progress.</title>
<style>
:root{--navy:#172554;--blue:#3457d5;--pale:#f4f6fc;--text:#202943;--muted:#75809a;--line:#e5e9f2;--white:#fff;--green:#17865b;--orange:#a65b00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Arial,sans-serif;background:var(--pale);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{background:var(--navy);color:white;padding:18px clamp(16px,4vw,42px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px}.brand h1{font-size:20px;margin:0;letter-spacing:1px}.brand small{color:#c7d2fe}.wrap{max-width:1180px;margin:auto;padding:clamp(16px,3vw,32px)}.auth-wrap{min-height:calc(100dvh - 80px);display:grid;place-items:center}.panel,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px);box-shadow:0 4px 20px #1725540a}.auth-panel{width:min(100%,480px)}h2{margin-top:0}.muted{color:var(--muted);line-height:1.6}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:650}.field input,.field select,input,select{width:100%;padding:12px;border:1px solid #d6ddec;border-radius:9px;background:white;color:var(--text);min-width:0}.btn{border:1px solid var(--line);background:white;color:var(--text);border-radius:9px;padding:11px 14px;font-weight:650}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.danger{color:#a11}.btn:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.notice{padding:13px 15px;border-radius:10px;background:#eef2ff;color:#26366c;line-height:1.5;margin:14px 0}.error{background:#fff0f0;color:#9b1c1c}.success{background:#eaf8f0;color:#12613d}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100dvh - 80px)}aside{background:white;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px}.nav{width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:12px;color:var(--text)}.nav.active,.nav:hover{background:#edf1ff;color:#233fa8}.main{padding:clamp(16px,3vw,30px);min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.metric{font-size:28px;font-weight:750;margin:8px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3447a5;font-size:12px}.pill.green{background:#e8f8ef;color:#17633f}.pill.orange{background:#fff2df;color:#8a4a00}.stack{display:grid;gap:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.empty{padding:24px;text-align:center;color:var(--muted)}footer{text-align:center;padding:18px;color:var(--muted);font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow:auto;padding:10px}.nav{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:16px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.brand h1{font-size:18px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="brand"><img src="./icon.svg" alt=""><div><h1>FLUENT LAB</h1><small>Learn. Practice. Progress.</small></div></div><div id="headerRight"></div></header>
<div id="root" class="wrap auth-wrap"><section class="panel auth-panel"><h2>Welcome to FLUENT LAB</h2><p class="muted">Loading secure sign-in…</p></section></div>
<footer>FLUENT LAB · Your learning space</footer>
<script>
const SUPABASE_URL="https://zkolqclsgxjmveoqlzmo.supabase.co";
const SUPABASE_KEY="sb_publishable_-zAXsbpPjsZPPLHkk6jOGA_ir4GVTXa";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,profile=null,page="Dashboard",classes=[],students=[],resources=[],exams=[],results=[];
const root=document.getElementById("root"),headerRight=document.getElementById("headerRight");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=(text,type="notice")=>'<div class="notice '+type+'">'+esc(text)+'</div>';
function authView(mode="login",notice=""){
 root.className="wrap auth-wrap";
 root.innerHTML='<section class="panel auth-panel"><div class="eyebrow" style="color:#3457d5;font-size:11px;font-weight:800;letter-spacing:1.5px">LEARN · PRACTICE · PROGRESS</div><h2>'+(mode==="signup"?"Create your student account":mode==="reset"?"Reset your password":"Sign in to FLUENT LAB")+'</h2><p class="muted">'+(mode==="signup"?"Register with your email. Your account stays pending until the owner approves it.":mode==="reset"?"We will email you a password-reset link.":"Use your registered email and password to continue.")+'</p>'+notice+'<form id="authForm">'+(mode==="signup"?'<div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required maxlength="120"></div>':'')+'<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>'+(mode!=="reset"?'<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="'+(mode==="signup"?"new-password":"current-password")+'" minlength="8" required></div>':'')+'<button class="btn primary" id="submitBtn" style="width:100%;margin-top:8px">'+(mode==="signup"?"Register":mode==="reset"?"Send reset link":"Sign in")+'</button></form><div class="actions">'+(mode!=="login"?'<button class="btn" id="goLogin">Back to sign in</button>':'<button class="btn" id="goSignup">Create student account</button><button class="btn" id="goReset">Forgot password?</button>')+'</div><p class="muted" style="font-size:12px;margin-top:18px">Registering does not grant access automatically. Approval is required.</p></section>';
 if(document.getElementById("goSignup"))document.getElementById("goSignup").onclick=()=>authView("signup");
 if(document.getElementById("goReset"))document.getElementById("goReset").onclick=()=>authView("reset");
 if(document.getElementById("goLogin"))document.getElementById("goLogin").onclick=()=>authView("login");
 document.getElementById("authForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=String(f.get("email")).trim().toLowerCase(),password=String(f.get("password")||""),btn=document.getElementById("submitBtn");btn.disabled=true;btn.textContent="Please wait…";
 try{let r;if(mode==="signup"){r=await sb.auth.signUp({email,password,options:{data:{full_name:String(f.get("fullName")).trim(),requested_role:"student"},emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;authView("login",msg("Registration submitted. Check your email if verification is required. After verifying, sign in. Your account remains pending until the owner approves it.","success"));return}
 if(mode==="reset"){r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error)throw r.error;authView("login",msg("If the address is registered, a password-reset email will be sent.","success"));return}
 r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;await loadSession();
 }catch(err){authView(mode,msg(err.message||"Something went wrong.","error"))}
 finally{const b=document.getElementById("submitBtn");if(b)b.disabled=false}
 };
}
function pendingView(){root.className="wrap auth-wrap";root.innerHTML='<section class="panel auth-panel"><h2>Account awaiting approval</h2>'+msg("Your email account is signed in, but FLUENT LAB access is pending owner approval. You can sign out and return later.")+'<p class="muted">Once approved, sign in again to access your learning space.</p><button class="btn" id="signout">Sign out</button></section>';document.getElementById("signout").onclick=()=>sb.auth.signOut();}
async function loadSession(){const {data:{user:u}}=await sb.auth.getUser();user=u;if(!user){profile=null;headerRight.innerHTML="";authView("login");return}
 const {data:p,error}=await sb.from("profiles").select("username,email,role,status,\"full name\"").eq("username",user.id).maybeSingle();
 if(error){root.innerHTML='<section class="panel">'+msg("Could not load your account profile. Please try again.","error")+'<button class="btn" onclick="sb.auth.signOut()">Sign out</button></section>';return}
 profile=p;if(!profile||profile.status!=="active"){headerRight.innerHTML='<button class="btn" id="signoutTop">Sign out</button>';document.getElementById("signoutTop").onclick=()=>sb.auth.signOut();pendingView();return}
 headerRight.innerHTML='<span style="font-size:13px;margin-right:12px">'+esc(profile["full name"]||profile.email||"Account")+'</span><button class="btn" id="signoutTop">Sign out</button>';document.getElementById("signoutTop").onclick=()=>sb.auth.signOut();await loadData();appView();
}
async function loadData(){const tasks=[sb.from("classrooms").select("id,name,level,teacher_id,status,created_at").order("created_at",{ascending:false}),sb.from("resources").select("id,classroom_id,title,category,resource_type,content_url,created_at").order("created_at",{ascending:false}),sb.from("exams").select("id,classroom_id,title,max_score,status,created_at").order("created_at",{ascending:false}),sb.from("results").select("id,exam_id,student_id,score,created_at").order("created_at",{ascending:false})];const rs=await Promise.all(tasks);[classes,resources,exams,results]=rs.map(x=>x.data||[]);if(profile.role==="owner"){const s=await sb.from("profiles").select('username,email,"full name",role,status,created_at').order("created_at",{ascending:false});students=s.data||[]}}
function appView(){root.className="";const owner=profile.role==="owner",teacher=profile.role==="teacher",student=profile.role==="student",parent=profile.role==="parent";
 let nav=[["Dashboard","⌂"]];if(owner)nav.push(["Approvals","✓"],["Classrooms","▦"],["Students","♙"]);if(owner||teacher)nav.push(["Resources","▤"],["Exams & Results","✎"]);if(student)nav.push(["My Classes","▦"],["Resources","▤"],["My Results","✓"]);if(parent)nav.push(["My Children","♡"]);
 root.innerHTML='<div class="layout"><aside>'+nav.map(([n,i])=>'<button class="nav '+(page===n?"active":"")+'" data-page="'+n+'">'+i+' &nbsp; '+n+'</button>')+'<div style="margin-top:auto;font-size:12px;color:#75809a;padding:12px">Role: '+esc(profile.role)+'</div></aside><main class="main" id="main"></main></div>';
 root.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;appView()});const m=document.getElementById("main");
 if(page==="Approvals"&&owner)m.innerHTML='<div class="topline"><div><h2>Student approvals</h2><p class="muted">Approve student accounts only after checking who registered.</p></div><button class="btn" id="refresh">Refresh</button></div><div class="card table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>'+students.map(s=>'<tr><td>'+esc(s["full name"]||"—")+'</td><td>'+esc(s.email)+'</td><td>'+esc(s.role)+'</td><td><span class="pill '+(s.status==="active"?"green":"orange")+'">'+esc(s.status)+'</span></td><td>'+(s.status!=="active"?'<button class="btn primary" data-approve="'+s.username+'">Approve student</button>':'<button class="btn" data-pending="'+s.username+'">Suspend</button>')+'</td></tr>').join("")+'</tbody></table>'+(students.length?"":'<div class="empty">No profiles to show.</div>')+'</div>';
 else if(page==="Classrooms"&&(owner||teacher))m.innerHTML='<div class="topline"><div><h2>Classrooms</h2><p class="muted">Create learning groups for your students.</p></div><button class="btn primary" id="addClass">＋ New classroom</button></div><div class="stack">'+classes.map(c=>'<div class="card row"><div><strong>'+esc(c.name)+'</strong><p class="muted">'+esc(c.level||"Level not set")+' · '+esc(c.status)+'</p></div><button class="btn" data-enroll="'+c.id+'">Add student</button></div>').join("")+'</div>'+(classes.length?"":'<div class="card empty">No classrooms yet.</div>');
 else if(page==="Resources"&&(owner||teacher||student))m.innerHTML='<div class="topline"><div><h2>Learning resources</h2><p class="muted">Resources are shared according to classroom permissions.</p></div>'+(owner||teacher?'<button class="btn primary" id="addResource">＋ Add resource</button>':"")+'</div><div class="stack">'+resources.map(r=>'<div class="card"><strong>'+esc(r.title)+'</strong><p class="muted">'+esc(r.category||"Learning material")+' · '+esc(classes.find(c=>c.id===r.classroom_id)?.name||"Classroom")+'</p>'+(r.content_url?'<a href="'+esc(r.content_url)+'" target="_blank" rel="noopener">Open resource ↗</a>':'<span class="muted">No file or link attached</span>')+'</div>').join("")+'</div>'+(resources.length?"":'<div class="card empty">No resources available yet.</div>');
 else if((page==="Exams & Results"&&(owner||teacher))||page==="My Results")m.innerHTML='<h2>'+(page==="My Results"?"My results":"Exams & results")+'</h2><p class="muted">Published exams and recorded scores.</p>'+(owner||teacher?'<button class="btn primary" id="addExam">＋ Add exam</button>':"")+'<div class="stack" style="margin-top:14px">'+exams.filter(e=>page!=="My Results"||e.status==="published").map(e=>'<div class="card"><div class="row"><strong>'+esc(e.title)+'</strong><span class="pill">'+esc(e.status)+' · Max '+esc(e.max_score)+'</span></div></div>').join("")+'</div><div class="card table-wrap" style="margin-top:16px"><h3>Recorded results</h3><table><thead><tr><th>Exam</th><th>Score</th><th>Date</th></tr></thead><tbody>'+results.filter(r=>page!=="My Results"||r.student_id===user.id).map(r=>'<tr><td>'+esc(exams.find(e=>e.id===r.exam_id)?.title||"Exam")+'</td><td>'+esc(r.score)+'</td><td>'+esc(new Date(r.created_at).toLocaleDateString())+'</td></tr>').join("")+'</tbody></table></div>';
 else if(page==="Students"&&owner)m.innerHTML='<h2>Profiles</h2><p class="muted">Use Approvals to approve student accounts. Assigning teachers and parents will be added after the account workflow is verified.</p><div class="card table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>'+students.map(s=>'<tr><td>'+esc(s["full name"]||"—")+'</td><td>'+esc(s.email)+'</td><td>'+esc(s.role)+'</td><td>'+esc(s.status)+'</td></tr>').join("")+'</tbody></table></div>';
 else if(page==="My Children"&&parent)m.innerHTML='<h2>Parent view</h2><div class="card">'+msg("Parent-child linking must be confirmed by the owner before child records can be shown.")+'</div>';
 else if(page==="My Classes"&&student)m.innerHTML='<h2>My classrooms</h2><div class="stack">'+classes.map(c=>'<div class="card"><strong>'+esc(c.name)+'</strong><p class="muted">'+esc(c.level||"")+'</p></div>').join("")+'</div>';
 else m.innerHTML='<div class="topline"><div><p style="color:#3457d5;font-size:11px;font-weight:800;letter-spacing:1.5px">LEARN · PRACTICE · PROGRESS</p><h2>Welcome to FLUENT LAB</h2><p class="muted">Your English learning workspace, connected to your account.</p></div><span class="pill green">Signed in</span></div><div class="grid"><div class="card"><div class="muted">Classrooms available</div><div class="metric">'+classes.length+'</div></div><div class="card"><div class="muted">Learning resources</div><div class="metric">'+resources.length+'</div></div><div class="card"><div class="muted">Exams published</div><div class="metric">'+exams.filter(e=>e.status==="published").length+'</div></div></div><div class="card">'+(owner?msg("You are signed in as the active owner. Start by approving student registrations and creating classrooms."):student?msg("Your student account is active. Your classroom materials will appear when the owner assigns you to a class."):"Use the menu to open your available modules.")+'</div>';
 bindActions();
}
function bindActions(){
 const refresh=document.getElementById("refresh");if(refresh)refresh.onclick=async()=>{await loadData();appView()};
 root.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>changeStatus(b.dataset.approve,"student","active"));
 root.querySelectorAll("[data-pending]").forEach(b=>b.onclick=()=>changeStatus(b.dataset.pending,"student","suspended"));
 const addClass=document.getElementById("addClass");if(addClass)addClass.onclick=async()=>{const name=prompt("Classroom name");if(!name?.trim())return;const level=prompt("Level (for example Grade 1 or A1)","Grade 1")||"";const {error}=await sb.from("classrooms").insert({name:name.trim(),level,teacher_id:user.id,status:"active"});if(error)alert(error.message);else{await loadData();appView()}};
 const addResource=document.getElementById("addResource");if(addResource)addResource.onclick=async()=>{if(!classes.length){alert("Create a classroom first.");return}const title=prompt("Resource title");if(!title?.trim())return;const category=prompt("Category (Reading, Vocabulary, Worksheet…)","Worksheet")||"Learning material";const c=classes.find(x=>x.name===prompt("Type the classroom name exactly:\n"+classes.map(x=>x.name).join("\n")));if(!c){alert("Classroom not found. Please try again.");return}const url=prompt("Optional resource URL (leave blank to add details only)","")||null;const {error}=await sb.from("resources").insert({classroom_id:c.id,title:title.trim(),category,resource_type:"link",content_url:url,created_by:user.id});if(error)alert(error.message);else{await loadData();appView()}};
 const addExam=document.getElementById("addExam");if(addExam)addExam.onclick=async()=>{if(!classes.length){alert("Create a classroom first.");return}const title=prompt("Exam title");if(!title?.trim())return;const c=classes.find(x=>x.name===prompt("Type the classroom name exactly:\n"+classes.map(x=>x.name).join("\n")));if(!c){alert("Classroom not found.");return}const max=Number(prompt("Maximum score","100"));if(!Number.isFinite(max)||max<=0){alert("Enter a positive maximum score.");return}const {error}=await sb.from("exams").insert({classroom_id:c.id,title:title.trim(),max_score:max,status:"draft",created_by:user.id});if(error)alert(error.message);else{await loadData();appView()}};
 root.querySelectorAll("[data-enroll]").forEach(b=>b.onclick=async()=>{if(!students.length){await loadData()}const candidates=students.filter(s=>s.role==="student"&&s.status==="active");if(!candidates.length){alert("Approve a student account first.");return}const email=prompt("Enter the student's email:\n"+candidates.map(s=>s.email).join("\n"));const s=candidates.find(s=>s.email?.toLowerCase()===email?.trim().toLowerCase());if(!s){alert("No active student matched that email.");return}const {error}=await sb.from("classroom_students").upsert({classroom_id:b.dataset.enroll,student_id:s.username,status:"active"});if(error)alert(error.message);else alert("Student added to the classroom.");});
}
async function changeStatus(id,role,status){if(!confirm((status==="active"?"Approve":"Suspend")+" this account?"))return;const {error}=await sb.rpc("admin_update_profile",{target_user_id:id,new_role:role,new_status:status});if(error){alert("Could not update account: "+error.message);return}await loadData();appView()}
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){user=null;profile=null;authView("login")}});
(async()=>{if(!window.supabase){authView("login",msg("The sign-in service could not load. Check your internet connection and refresh.","error"));return}const {data:{session}}=await sb.auth.getSession();if(session)await loadSession();else authView("login");})();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
